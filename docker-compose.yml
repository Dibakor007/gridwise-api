version: '3.8'

services:
  optimizer-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bup_energy_optimizer
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
